<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi página HTML y CSS</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>

        <div>
            MyLogo
        </div>

        <nav aria-label="Navegación principal">

            <ul>
                <li>
                    <a href="#inicio">Home</a>
                </li>

                <li>
                    <a href="#articulos">About</a>
                </li>

                <li>
                    <a href="#contacto">Contact</a>
                </li>
            </ul>

        </nav>

    </header>


    <main id="inicio">

        <section id="articulos">

            <h1>Artículos</h1>

<div>

    <article>

        <img
            src="img/articulo1.jpg"
            alt="Imagen representativa del primer artículo"
        >

        <h2>Article Title</h2>

        <p>
            Article content goes here.
            This is a sample article content.
        </p>

    </article>


    <article>

        <img
            src="img/articulo2.jpg"
            alt="Imagen representativa del segundo artículo"
        >

        <h2>Article Title</h2>

        <p>
            Article content goes here.
            This is a sample article content.
        </p>

    </article>

</div>

        </section>


        <section id="contacto">

    <h2>Contact Form</h2>

    <form action="#" method="post">

        <div>

            <label for="nombre">
                Name:
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

        </div>


        <div>

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

        </div>


        <div>

            <label for="mensaje">
                Message:
            </label>

            <textarea
                id="mensaje"
                name="mensaje"
                rows="5"
                required
            ></textarea>

        </div>


        <button type="submit">
            Submit
        </button>

    </form>

</section>


        <section>

            <h2>Student Scores</h2>

        </section>

    </main>


    <footer>

        <p>
            Contact us at:
            <a href="info@example.com">
                info@example.com
            </a>
        </p>

    </footer>

</body>

</html>
